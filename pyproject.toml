[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "subcheck"
version = "0.1.0"
description = "Checks whether a subtitle file (SRT) is accurate for a given video, by sampling random snippets and comparing faster-whisper ASR transcripts against the subtitles (WER + temporal IoU)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0.0",
    "pysrt>=1.1.1",
    "jiwer>=3.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries for GPU inference with ctranslate2:
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]
# OpenSubtitles access for `subcheck autosub`
autosub = ["opensubtitlescom"]
all = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
    "opensubtitlescom",
]
dev = ["pytest>=7.0"]

[project.scripts]
subcheck = "subcheck.cli:main"

[tool.setuptools.packages.find]
include = ["subcheck*"]
